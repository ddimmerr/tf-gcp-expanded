version: '3.8'

services:
  app-dev:
    image: ${DOCKER_IMAGE_TAG} # <-- Changed: Pulls pre-built image from GCP
    container_name: app-dev
    restart: always
    ports:
      - "8081:8080"
    environment:
      - ENV_NAME=development # Matches your app.js variable

  app-staging:
    image: ${DOCKER_IMAGE_TAG} # <-- Changed: Pulls pre-built image from GCP
    container_name: app-staging
    restart: always
    ports:
      - "8082:8080"
    environment:
      - ENV_NAME=staging     # Matches your app.js variable

  app-prod:
    image: ${DOCKER_IMAGE_TAG} # <-- Changed: Pulls pre-built image from GCP
    container_name: app-prod
    restart: always
    ports:
      - "8080:8080"
    environment:
      - ENV_NAME=production  # Matches your app.js variable
