version: '3.8'

services:
  app-dev:
    build: 
      context: ./app
      dockerfile: Dockerfile
    container_name: app-dev
    restart: always
    ports:
      - "8081:8080" # Local port 8081 -> Dev container 8080
    environment:
      - NODE_ENV=development
      - APP_ENV=dev

  app-staging:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-staging
    restart: always
    ports:
      - "8082:8080" # Local port 8082 -> Staging container 8080
    environment:
      - NODE_ENV=staging
      - APP_ENV=staging

  app-prod:
    build:
      context: ./app
      dockerfile: Dockerfile
    container_name: app-prod
    restart: always
    ports:
      - "8080:8080" # Local port 8080 -> Production container 8080
    environment:
      - NODE_ENV=production
      - APP_ENV=production